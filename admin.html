<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>geSolar · Gestión</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--gris-m:#4E4952;--azul:#4F70BF;--azul-o:#3D5AA3;--azul-c:#E7EDF9;--fondo:#F4F5F8;--tinta:#2E2B31;--gris:#6A6670;--linea:#DCDFE6;
  --rojo:#C23B28;--rojo-c:#FBE7E3;--verde:#1F8455;--verde-c:#E0F2E9;--naranja:#D9700B;--naranja-c:#FCEBD8;--ambar-c:#FFF1C9;--lado:236px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--tinta);font:400 15px/1.45 'Barlow',system-ui,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.num{font-family:'Barlow Condensed','Barlow',sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--azul)}

/* Estructura */
.shell{display:grid;grid-template-columns:var(--lado) 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--linea);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside img{width:160px;margin:4px 8px 24px}
aside nav{display:grid;gap:2px}
aside nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--gris);cursor:pointer}
aside nav button:hover{background:var(--fondo);color:var(--tinta)}
aside nav button[aria-current]{background:var(--azul-c);color:var(--azul-o)}
aside nav .n{background:var(--rojo);color:#fff;border-radius:9px;font-size:12px;min-width:20px;padding:0 6px;text-align:center}
aside .pie{margin-top:auto;padding:12px;border-top:1px solid var(--linea);font-size:14px;color:var(--gris)}
aside .pie b{display:block;color:var(--tinta)}
aside .pie button{border:0;background:none;color:var(--azul);padding:0;margin-top:6px;font-weight:600;cursor:pointer}
main{padding:26px 32px 60px;min-width:0}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cab h1{margin:0;font-size:28px;line-height:1.1}
.cab p{margin:4px 0 0;color:var(--gris)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h2{font-size:17px;margin:0 0 10px}

/* Controles */
.btn{border:0;border-radius:10px;min-height:40px;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.b-azul{background:var(--azul);color:#fff}.b-azul:hover{background:var(--azul-o)}
.b-linea{background:#fff;border:1px solid var(--linea)}.b-linea:hover{border-color:#BFC5D0}
.b-osc{background:var(--gris-m);color:#fff}
.b-rojo{background:#fff;border:1px solid var(--linea);color:var(--rojo)}
.b-peq{min-height:32px;padding:0 10px;font-size:14px;border-radius:8px}
input,select,textarea{border:1px solid var(--linea);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul-c);border-color:var(--azul)}
.buscar{width:240px}
.seg{display:inline-flex;background:#E7E9EE;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--gris);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--azul-o);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Tarjetas y tablas */
.card{background:#fff;border:1px solid var(--linea);border-radius:12px}
.card.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{padding:14px 16px;background:#fff;border:1px solid var(--linea);border-radius:12px;text-align:left;cursor:pointer}
.kpi b{display:block;font-size:34px;line-height:1;font-family:'Barlow Condensed',sans-serif}
.kpi span{color:var(--gris);font-size:14px}
.kpi.alerta b{color:var(--rojo)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.tabla-w{overflow:auto;background:#fff;border:1px solid var(--linea);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#FAFAFC;text-align:left;font-size:13px;font-weight:600;color:var(--gris);padding:10px 12px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #ECEEF2;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:#F7F8FB}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--gris);font-size:13px}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vacio{padding:30px;text-align:center;color:var(--gris)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:#ECEEF2;color:var(--gris-m);white-space:nowrap}
.chip.azul{background:var(--azul-c);color:var(--azul-o)}.chip.verde{background:var(--verde-c);color:var(--verde)}
.chip.rojo{background:var(--rojo-c);color:var(--rojo)}.chip.naranja{background:var(--naranja-c);color:#9A4F06}
.chip.ambar{background:var(--ambar-c);color:#7A5A00}.chip.osc{background:var(--gris-m);color:#fff}
.alerta-l{padding:10px 12px;border-radius:9px;background:var(--rojo-c);color:#7F2214;margin-bottom:8px}
.alerta-l.n{background:var(--naranja-c);color:#7A3E05}
.barra{height:6px;background:#E7E9EE;border-radius:4px;overflow:hidden;margin-top:4px;min-width:70px}
.barra i{display:block;height:100%;background:var(--azul)}.barra i.pasado{background:var(--rojo)}

/* Planificación */
.plan{table-layout:fixed;min-width:1050px}
.plan th.dia{text-align:center}
.plan th.hoy{color:var(--azul-o);background:var(--azul-c)}
.plan td{height:90px;padding:6px;border-right:1px solid #ECEEF2}
.plan td.persona{width:150px;font-weight:600;background:#FAFAFC}
.plan td.finde{background:#FBFBFC}
.plan td.celda{cursor:pointer}
.plan td.celda:hover{background:#F5F7FC}
.plan .mas{display:block;text-align:center;color:#B6BCC8;font-size:20px;line-height:1;margin-top:4px}
.tchip{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--azul);background:var(--azul-c);border-radius:6px;padding:5px 7px;margin-bottom:5px;font-size:13px;line-height:1.25;cursor:pointer}
.tchip small{display:block;color:var(--gris)}
.tchip.alta{border-left-color:var(--naranja);background:var(--naranja-c)}
.tchip.urgente{border-left-color:var(--rojo);background:var(--rojo-c)}
.tchip.hecha{background:#F0F1F4;border-left-color:#BFC5D0;color:var(--gris);text-decoration:line-through}
.tchip.atras{outline:2px solid var(--rojo)}

/* Calendario de ausencias */
.cal-aus{table-layout:fixed;min-width:1100px}
.cal-aus th,.cal-aus td{padding:4px 2px;text-align:center;font-size:12px;border-right:1px solid #F0F1F4}
.cal-aus td.persona,.cal-aus th.persona{width:150px;text-align:left;padding-left:10px;font-size:14px}
.cal-aus .fd{background:#F7F7F9}
.cal-aus .a{background:var(--azul);color:#fff;border-radius:3px}
.cal-aus .p{background:var(--ambar-c);outline:1px dashed #B98500}
.cal-aus .b{background:var(--rojo-c)}

/* Modal */
.velo{position:fixed;inset:0;background:rgba(30,28,33,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.ancho{max-width:1000px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--linea)}
.modal-cab h3{margin:0;font-size:20px}
.modal-cab button{border:0;background:var(--fondo);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.modal-cuerpo{padding:18px 20px}
.modal-pie{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--linea)}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 14px}
.form label{display:block;font-weight:600;font-size:13px;margin-bottom:4px;color:var(--gris-m)}
.form .c2{grid-column:span 2}.form .c3{grid-column:span 3}.form .c6{grid-column:span 6}
.form input,.form select,.form textarea{width:100%}
.form textarea{min-height:80px;resize:vertical}
.form h4{grid-column:span 6;margin:8px 0 0;font-size:14px;color:var(--azul-o);border-bottom:1px solid var(--linea);padding-bottom:4px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--linea);border-radius:8px;padding:6px 10px;font-weight:500;margin:0;cursor:pointer}
.checks input{width:auto;min-height:0}
.error{color:var(--rojo);font-weight:600}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:20px}
.lista-s{display:grid;gap:6px;max-height:260px;overflow:auto}
.lista-s div{padding:8px 10px;border:1px solid #ECEEF2;border-radius:8px;font-size:14px}
.lista-s small{color:var(--gris)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gris-m);color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:60;font-weight:500}
#toast.ver{display:block}#toast.mal{background:var(--rojo)}

/* Acceso */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}
.login form{width:340px}
.login img{width:260px;display:block;margin:0 auto 6px}
.login p{text-align:center;color:var(--gris);margin:0 0 24px}
.login label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.login input{width:100%;min-height:46px}
.login .btn{width:100%;justify-content:center;min-height:48px;margin-top:20px;font-size:16px}
.cargando{padding:60px;text-align:center;color:var(--gris)}
@media (max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}aside img{width:110px;margin:0 10px 0 0}aside nav{display:flex;flex-wrap:wrap}aside .pie{border:0;margin:0;padding:0 8px}.dos,.cols{grid-template-columns:1fr}main{padding:18px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CFG = window.APP_CONFIG || {}, API_URL = CFG.API_URL || '';
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k, d = null) { try { const v = localStorage.getItem('st_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('st_' + k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem('st_' + k); } catch {} } };
const pad = n => String(n).padStart(2, '0');
const clave = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => clave(new Date());
const aF = f => new Date(String(f).length === 10 ? f + 'T12:00:00' : f);
const fC = f => f ? aF(f).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
const fCA = f => f ? aF(f).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const hora = iso => { const d = new Date(iso); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hm = m => { m = Math.max(0, Math.round(m || 0)); return Math.floor(m / 60) + ':' + pad(m % 60); };
const n1 = n => Number(n || 0).toLocaleString('es-ES', { maximumFractionDigits: 2 });
const euro = n => Number(n || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + Math.random().toString(16).slice(2);
const mayus = t => t.charAt(0).toUpperCase() + t.slice(1);
const mapa = (la, ln) => `https://www.google.com/maps/search/?api=1&query=${la},${ln}`;

const E_OBRA = { planificada: ['Planificada', 'ambar'], 'en curso': ['En curso', 'azul'], finalizada: ['Finalizada', 'verde'], facturada: ['Facturada', ''] };
const E_AVISO = { nuevo: ['Nuevo', 'rojo'], asignado: ['Asignado', 'azul'], 'en curso': ['En curso', 'osc'], resuelto: ['Resuelto', 'verde'], cerrado: ['Cerrado', ''] };
const PRIO = { urgente: ['Urgente', 'rojo'], alta: ['Alta', 'naranja'], normal: ['Normal', ''], baja: ['Baja', ''] };
const T_AVISO = { 'avería': 'Avería', mantenimiento: 'Mantenimiento', limpieza: 'Limpieza', 'garantía': 'Garantía', consulta: 'Consulta', otro: 'Otro' };
const T_AUS = { vacaciones: 'Vacaciones', 'asuntos propios': 'Asuntos propios', permiso: 'Permiso', baja: 'Baja médica' };
const chip = (m, k) => { const v = m[k] || [k, '']; return `<span class="chip ${v[1]}">${esc(v[0])}</span>`; };
const opciones = (m, sel) => Object.entries(m).map(([k, v]) => `<option value="${esc(k)}" ${k === sel ? 'selected' : ''}>${esc(Array.isArray(v) ? v[0] : v)}</option>`).join('');

const S = { token: LS.get('token'), user: LS.get('user'), vista: location.hash.slice(1) || 'resumen', cache: {} };

/* Servidor */
class ApiError extends Error {}
async function api(action, data = {}) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...data }) }); }
  catch { throw new Error('No hay conexión con el servidor.'); }
  let j; try { j = await r.json(); } catch { throw new Error('El servidor no ha respondido bien. Revisa la URL en config.js.'); }
  if (!j.ok) { if (j.error === 'SESION') { salir(); throw new ApiError('Tu sesión ha caducado.'); } throw new ApiError(j.error); }
  return j.data;
}
async function usuarios(forzar) { if (forzar || !S.cache.usuarios) S.cache.usuarios = await api('usuarios'); return S.cache.usuarios; }
const activos = l => l.filter(u => u.activo);

let tT;
function toast(m, mal) { const t = $('#toast'); t.textContent = m; t.className = 'ver' + (mal ? ' mal' : ''); clearTimeout(tT); tT = setTimeout(() => t.className = '', mal ? 5000 : 2800); }

/* Ventanas */
function modal(titulo, cuerpo, { ancho = false, pie = '' } = {}) {
  cerrarModal();
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = `<div class="modal ${ancho ? 'ancho' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="modal-cab"><h3>${esc(titulo)}</h3><button aria-label="Cerrar" data-x>×</button></div>
    <div class="modal-cuerpo">${cuerpo}</div>${pie ? `<div class="modal-pie">${pie}</div>` : ''}</div>`;
  v.addEventListener('mousedown', e => { if (e.target === v) cerrarModal(); });
  $('[data-x]', v).onclick = cerrarModal;
  document.body.appendChild(v);
  const f = $('input,select,textarea', v); if (f) setTimeout(() => f.focus(), 30);
  return v;
}
function cerrarModal() { $$('.velo').forEach(x => x.remove()); }
addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
function confirmar(texto, si = 'Confirmar') {
  return new Promise(res => {
    const v = modal('¿Seguro?', `<p>${esc(texto)}</p>`, { pie: `<button class="btn b-linea" data-no>Cancelar</button><button class="btn b-osc" data-si>${esc(si)}</button>` });
    $('[data-no]', v).onclick = () => { cerrarModal(); res(false); };
    $('[data-si]', v).onclick = () => { cerrarModal(); res(true); };
  });
}
/** Conecta el botón de guardar de una ventana con su formulario. */
function alGuardar(v, fn) {
  const b = $('[data-guardar]', v), f = $('form', v), err = $('.error', v);
  const go = async e => {
    if (e) e.preventDefault();
    if (!f.reportValidity()) return;
    const t = b.textContent; b.disabled = true; b.textContent = 'Guardando…'; err.textContent = '';
    try { await fn(Object.fromEntries(new FormData(f)), f); }
    catch (x) { err.textContent = x.message; b.disabled = false; b.textContent = t; }
  };
  b.onclick = go; f.onsubmit = go;
}

/* Acceso */
function vLogin(msg = '') {
  const falta = !API_URL || API_URL.includes('PEGA_AQUI');
  $('#root').innerHTML = `<div class="login"><form id="fl">
    <img src="logo.png" alt="geSolar energy solutions"><p>Panel de gestión</p>
    ${falta ? '<div class="alerta-l">Falta la URL del servidor en config.js.</div>' : ''}
    <label for="u">Usuario</label><input id="u" name="usuario" autocomplete="username" required value="${esc(LS.get('ultimoUsuario', ''))}">
    <label for="p">PIN</label><input id="p" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn b-azul" type="submit">Entrar</button><p class="error" style="margin-top:12px">${esc(msg)}</p></form></div>`;
  $('#fl').onsubmit = async e => {
    e.preventDefault(); const d = Object.fromEntries(new FormData(e.target)), b = $('button', e.target);
    b.disabled = true; b.textContent = 'Entrando…';
    try {
      const r = await api('login', d);
      if (r.usuario.rol !== 'admin') return vLogin('Este panel es solo para administradores. Los operarios usan la app del móvil.');
      S.token = r.token; S.user = r.usuario; LS.set('token', r.token); LS.set('user', r.usuario); LS.set('ultimoUsuario', d.usuario);
      pintar();
    } catch (x) { vLogin(x.message); }
  };
}
function salir() { LS.del('token'); LS.del('user'); S.token = null; S.user = null; S.cache = {}; vLogin(); }

/* Estructura */
const SECCIONES = [['resumen', 'Resumen'], ['planificacion', 'Planificación'], ['obras', 'Obras'], ['avisos', 'Avisos'], ['ausencias', 'Ausencias'], ['jornada', 'Registro de jornada'], ['furgonetas', 'Furgonetas'], ['equipo', 'Equipo']];
function pintar() {
  if (!S.token || !S.user) return vLogin();
  if (S.user.rol !== 'admin') return vLogin('Este panel es solo para administradores.');
  $('#root').innerHTML = `<div class="shell"><aside><img src="logo.png" alt="geSolar">
    <nav aria-label="Secciones">${SECCIONES.map(([k, t]) => `<button data-v="${k}">${t}<span class="n" id="n-${k}" hidden></span></button>`).join('')}</nav>
    <div class="pie"><b>${esc(S.user.nombre)}</b>Administrador<br><a href="index.html">Abrir la app móvil</a><br><button id="salir">Cerrar sesión</button></div></aside>
    <main id="main"></main></div>`;
  $$('[data-v]').forEach(b => b.onclick = () => ir(b.dataset.v));
  $('#salir').onclick = salir;
  ir(S.vista, true);
}
const VISTAS = {};
async function ir(v, inicial) {
  if (!VISTAS[v]) v = 'resumen';
  S.vista = v; if (!inicial || location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  $$('[data-v]').forEach(b => b.dataset.v === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  const m = $('#main'); m.innerHTML = '<div class="cargando">Cargando…</div>';
  try { await VISTAS[v](m); } catch (e) { m.innerHTML = `<div class="card vacio">${esc(e.message)}<br><br><button class="btn b-azul" onclick="ir(S.vista)">Reintentar</button></div>`; }
}
const recargar = () => ir(S.vista);
function contador(id, n) { const e = $('#n-' + id); if (e) { e.hidden = !n; e.textContent = n || ''; } }
const cab = (t, sub, acc = '') => `<div class="cab"><div><h1>${esc(t)}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="acciones">${acc}</div></div>`;

/* ───── Resumen ───── */
VISTAS.resumen = async m => {
  const [p, eq] = await Promise.all([api('panel'), api('resumenEquipo')]);
  const atr = eq.reduce((s, x) => s + x.atrasadas, 0);
  contador('ausencias', p.ausencias.length); contador('avisos', p.avisos.sinAsignar);
  m.innerHTML = cab('Resumen', mayus(new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }))) + `
    <div class="kpis">
      <button class="kpi" data-ir="jornada"><b>${p.trabajando.length}<small style="font-size:18px;color:var(--gris)"> / ${p.plantilla}</small></b><span>fichados ahora</span></button>
      <button class="kpi" data-ir="obras"><b>${p.obrasEnCurso}</b><span>obras en curso</span></button>

/* ───── Planificación semanal ───── */
function lunes(f) { const d = aF(f); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return clave(d); }
function sumar(f, n) { const d = aF(f); d.setDate(d.getDate() + n); return clave(d); }
VISTAS.planificacion = async m => {
  S.semana = S.semana || lunes(hoy());
  const desde = S.semana, hasta = sumar(desde, 6), dias = [...Array(7)].map((_, i) => sumar(desde, i));
  const [lista, us] = await Promise.all([api('listarTareas', { desde, hasta }), usuarios()]);
  const gente = activos(us), h = hoy();
  const atr = lista.filter(t => t.estado === 'pendiente' && t.fecha < h).length;
  const chipT = t => `<button class="tchip ${esc(t.prioridad)} ${t.estado === 'hecha' ? 'hecha' : ''} ${t.estado === 'pendiente' && t.fecha < h ? 'atras' : ''}" data-t="${esc(t.id)}" title="${esc(t.descripcion || t.titulo)}">${esc(t.titulo)}${t.obraCliente || t.avisoNumero ? `<small>${esc([t.obraCliente, t.avisoNumero].filter(Boolean).join(', '))}</small>` : ''}</button>`;
  m.innerHTML = cab('Planificación', `Semana del ${fC(desde)} al ${fCA(hasta)}. ${lista.filter(t => t.estado === 'pendiente').length} tareas pendientes${atr ? `, <b style="color:var(--rojo)">${atr} atrasadas</b>` : ''}.`,
    `<button class="btn b-linea" data-s="-7">‹ Anterior</button><button class="btn b-linea" data-s="0">Esta semana</button><button class="btn b-linea" data-s="7">Siguiente ›</button><button class="btn b-azul" id="nt">Asignar tarea</button>`) + `
    <div class="tabla-w"><table class="plan"><thead><tr><th style="width:150px">Persona</th><th style="width:150px">Atrasadas</th>${dias.map((d, i) => `<th class="dia ${d === h ? 'hoy' : ''}">${mayus(aF(d).toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', ''))} ${aF(d).getDate()}</th>`).join('')}</tr></thead>
    <tbody>${gente.map(u => `<tr><td class="persona">${esc(u.nombre)}</td>
      <td>${lista.filter(t => t.usuarioId === u.id && t.estado === 'pendiente' && t.fecha < desde).map(chipT).join('')}</td>
      ${dias.map((d, i) => `<td class="celda ${i > 4 ? 'finde' : ''}" data-u="${esc(u.id)}" data-d="${d}">${lista.filter(t => t.usuarioId === u.id && t.fecha === d).map(chipT).join('')}<span class="mas" aria-hidden="true">+</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>

  $$('[data-s]', m).forEach(b => b.onclick = () => { S.semana = +b.dataset.s ? sumar(S.semana, +b.dataset.s) : lunes(hoy()); recargar(); });
  $('#nt').onclick = () => formTarea({});
  $$('[data-t]', m).forEach(b => b.onclick = e => { e.stopPropagation(); formTarea(lista.find(t => t.id === b.dataset.t)); });
  $$('td.celda', m).forEach(c => c.onclick = () => formTarea({ usuarioId: c.dataset.u, fecha: c.dataset.d }));
};

        <div class="c3"><label>Prioridad</label><select name="prioridad">${opciones(PRIO, x.prioridad)}</select></div>

    <div class="c3"><label>&nbsp;</label><label style="font-weight:500"><input type="checkbox" name="activo" ${u.id && !u.activo ? '' : 'checked'} style="width:auto;min-height:0"> Puede entrar en la app</label></div>
    <p class="error c6"></p></form>`, { pie: '<button class="btn b-linea" data-x2>Cancelar</button><button class="btn b-azul" data-guardar>Guardar</button>' });
  $('[data-x2]', v).onclick = cerrarModal;
  alGuardar(v, async d => { await api('guardarUsuario', { usuario: { ...d, id: u.id || '', activo: !!d.activo } }); S.cache.usuarios = null; cerrarModal(); toast(u.id ? 'Cambios guardados' : 'Persona añadida'); recargar(); });
}

pintar();
</script>
</body>
</html>
