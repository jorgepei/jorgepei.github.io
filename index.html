<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>geSolar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  /* Colores de la marca geSolar: gris del logotipo y azul de la franja inferior */
  --cielo:#4E4952; --cielo-2:#F0F2F6; --silicio:#4F70BF; --sol:#4F70BF; --azul-osc:#3D5AA3; --azul-claro:#E7EDF9;
  --ambar:#E8A400; --sol-claro:#FFF1C9;
  --cal:#F4F5F8; --blanco:#fff; --tinta:#2E2B31; --gris:#6A6670; --linea:#DCDFE6;
  --rojo:#C23B28; --rojo-claro:#FBE7E3; --verde:#1F8455; --verde-claro:#E0F2E9; --naranja:#D9700B; --naranja-claro:#FCEBD8;
  --nav-h:66px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:0}
body{background:var(--cal);color:var(--tinta);font:400 17px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.num{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--silicio);outline-offset:2px}
#app{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px)}
.sin-nav #app{padding-bottom:20px}

/* Cabecera */
.top{background:#fff;color:var(--tinta);border-bottom:1px solid var(--linea);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 22px}
.top-in{max-width:720px;margin:0 auto}
.top h1{margin:0;font-size:27px;font-weight:700;line-height:1.15}
.top p{margin:4px 0 0;color:var(--gris);font-size:15px}
.top .fila{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .fila>.btn{white-space:nowrap;flex:none}
.volver{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--silicio);padding:6px 0;margin:-6px 0 6px;font-weight:600;font-size:15px}
.wrap{padding:16px;max-width:720px;margin:0 auto}
h2{font-size:19px;margin:24px 0 10px;font-weight:700}
h2:first-child{margin-top:4px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border:0;border-radius:14px;font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;color:inherit}
.btn:disabled{opacity:.55}
.btn-sol{background:var(--sol);color:#fff}
.btn-sol:active{background:var(--azul-osc)}
.btn-azul{background:var(--silicio);color:#fff}
.btn-oscuro{background:var(--cielo);color:#fff}
.btn-linea{background:#fff;border:2px solid var(--linea);color:var(--tinta)}
.btn-rojo{background:var(--rojo);color:#fff}
.btn-claro{background:#ECEEF2;color:var(--tinta)}
.btn-peq{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.ancho{width:100%}
.grupo{display:flex;gap:10px;flex-wrap:wrap}
.grupo>.btn{flex:1 1 0;min-width:120px}

/* Jornada: el anillo es la pieza principal */
.jornada{background:#fff;color:var(--tinta);border-bottom:1px solid var(--linea);padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 24px}
.marca{max-width:720px;margin:0 auto 10px;display:block}
.marca img{height:34px;width:auto;display:block}
.jornada .saludo{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.jornada .saludo strong{font-size:22px}
.jornada .saludo span{color:var(--gris);font-size:15px}
.anillo{position:relative;width:min(72vw,270px);aspect-ratio:1;margin:18px auto 6px}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.anillo .tiempo{font-size:clamp(58px,17vw,76px);font-weight:700;line-height:.9;letter-spacing:-.01em}
.anillo .estado{margin-top:8px;font-size:16px;color:var(--gris)}
.anillo .estado b{color:var(--silicio);font-weight:700}
.anillo .meta{font-size:14px;color:var(--gris);margin-top:2px}
.acciones-jornada{max-width:420px;margin:14px auto 0;display:grid;gap:10px}
.btn-fichar{min-height:64px;font-size:20px;border-radius:999px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel-obra{width:100%;min-height:50px;border-radius:12px;border:2px solid var(--linea);padding:0 14px;background:var(--cielo-2);color:var(--tinta)}

/* Listas */
.lista{display:grid;gap:10px}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit;cursor:pointer}
button.item:active{background:#F8FAFC}
.item .t{font-weight:700;font-size:18px;line-height:1.25}
.item .s{color:var(--gris);font-size:15px;margin-top:2px}
.item .pie{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:15px;color:var(--gris)}
.prio-urgente{border-left:7px solid var(--rojo)}
.prio-alta{border-left:7px solid var(--naranja)}
.prio-normal{border-left:7px solid var(--silicio)}
.prio-baja{border-left:7px solid var(--linea)}
.fila-fichaje{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--linea)}
.fila-fichaje:last-child{border-bottom:0}
.fila-fichaje .h{font-size:26px;font-weight:700;width:68px}
.fila-fichaje .d{flex:1}
.fila-fichaje .g{font-size:14px;color:var(--gris)}
.wrap a:not(.btn){color:var(--silicio);font-weight:600}
.caja{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:4px 16px}
.caja.pad{padding:16px}
.vacio{padding:26px 18px;text-align:center;color:var(--gris);background:#fff;border:2px dashed var(--linea);border-radius:14px}
.vacio .btn{margin-top:12px}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;background:#ECEEF2;color:var(--cielo)}
.chip.azul{background:var(--azul-claro);color:var(--azul-osc)}
.chip.verde{background:var(--verde-claro);color:var(--verde)}
.chip.rojo{background:var(--rojo-claro);color:var(--rojo)}
.chip.naranja{background:var(--naranja-claro);color:#9A4F06}
.chip.sol{background:var(--sol-claro);color:#7A5A00}
.chip.oscuro{background:var(--cielo);color:#fff}

/* Segmentos */
.seg{display:flex;background:#E7E9EE;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;font-size:15px;color:var(--gris);white-space:nowrap;padding:0 10px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--silicio);box-shadow:0 1px 2px rgba(46,43,49,.15)}

/* Semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 12px 10px}
.semana .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.semana .barra{width:70%;max-width:28px;background:#BCCAEA;border-radius:6px 6px 2px 2px;min-height:3px}
.semana .hoy .barra{background:var(--silicio)}
.semana .v{font-size:13px;color:var(--gris)}
.semana .dia{font-size:13px;font-weight:600;text-transform:capitalize}

/* Datos de obra */
.datos{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.datos div{background:#fff;padding:12px 14px}
.datos dt{font-size:14px;color:var(--gris)}
.datos dd{margin:0;font-weight:600;font-size:17px}
.datos .grande{font-size:28px;font-weight:700;line-height:1.05}
.progreso{height:10px;background:#E7E9EE;border-radius:6px;overflow:hidden;margin-top:6px}
.progreso i{display:block;height:100%;background:var(--silicio)}
.progreso i.pasado{background:var(--rojo)}
.contacto{display:flex;gap:10px;margin-top:14px}
.contacto .btn{flex:1}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.fotos a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#DCE4EC;position:relative}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos span{position:absolute;left:4px;bottom:4px;background:rgba(46,43,49,.82);color:#fff;font-size:12px;padding:1px 7px;border-radius:6px}

/* Calendario */
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-cab strong{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:10px}
.cal .ds{font-size:13px;color:var(--gris);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;position:relative;border:2px solid transparent;background:none;padding:0}
.cal .d.finde{color:#9AA7B3}
.cal .d.hoy{border-color:var(--cielo)}
.cal .d.mia{background:var(--silicio);color:#fff;font-weight:700}
.cal .d.pend{border:2px dashed var(--sol-osc, #B98500);background:var(--sol-claro)}
.cal .d .p{position:absolute;bottom:3px;display:flex;gap:2px}
.cal .d .p i{width:5px;height:5px;border-radius:50%;background:var(--cielo)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--gris);margin-top:8px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.resumen div{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px;text-align:center}
.resumen b{display:block;font-size:34px;line-height:1;font-weight:700}
.resumen span{font-size:14px;color:var(--gris)}
.resumen .dest{background:var(--silicio);border-color:var(--silicio);color:#fff}
.resumen .dest span{color:#E1E8F7}

/* Panel */
.cifras{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cifras>*{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;text-align:left}
.cifras b{display:block;font-size:38px;line-height:1;font-weight:700}
.cifras span{font-size:15px;color:var(--gris)}
.cifras .alerta b{color:var(--rojo)}
.furgo{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px}
.placa{flex:none;display:flex;align-items:stretch;border:2px solid var(--tinta);border-radius:7px;overflow:hidden;background:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.06em;line-height:1}
.placa i{background:#1E4FB4;color:#fff;font-style:normal;font-size:11px;display:flex;align-items:flex-end;padding:3px 4px}
.placa span{padding:6px 9px}
.furgo .d{grid-column:1/-1;min-width:0}
.furgo [data-km]{justify-self:end}
.dos-campos>*{min-width:0}
.furgo .d b{display:block}
.furgo .d small{color:var(--gris);font-size:14px}
.venc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.menu{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.menu button,.menu a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:0;padding:16px;font-weight:600;text-align:left;text-decoration:none;color:inherit;width:100%}
.menu small{color:var(--gris);font-weight:400}
.tabla{width:100%;border-collapse:collapse;font-size:15px;background:#fff}
.tabla th,.tabla td{padding:9px 10px;border-bottom:1px solid var(--linea);text-align:left;white-space:nowrap}
.tabla th{font-size:13px;color:var(--gris);font-weight:600}
.tabla td.r,.tabla th.r{text-align:right}
.scroll-x{overflow-x:auto;border:1px solid var(--linea);border-radius:14px;background:#fff}

/* Hoja inferior (formularios) */
.velo{position:fixed;inset:0;background:rgba(30,28,33,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 18px);animation:sube .22s ease-out}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:var(--linea);margin:6px auto 10px}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.hoja-cab h3{margin:0;font-size:21px}
.cerrar{border:0;background:#EEF2F6;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}

/* Formularios */
.campo{margin-top:14px}
.campo label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;min-height:52px;border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;font-size:17px}
.campo textarea{min-height:96px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--silicio);outline:none}
.campo .ayuda{font-size:14px;color:var(--gris);margin-top:4px}
.dos-campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.check input{width:24px;height:24px;accent-color:var(--silicio)}
.previa{margin-top:10px;max-width:100%;max-height:220px;border-radius:12px;display:block}
.hoja form>.btn{margin-top:20px}
.error-form{color:var(--rojo);font-weight:600;margin-top:12px;min-height:1px}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;border:2px dashed var(--silicio);border-radius:14px;color:var(--silicio);font-weight:600;background:#F2F7FC;cursor:pointer}
.foto-btn input{display:none}

/* Login */
.login{min-height:100vh;background:#fff;color:var(--tinta);display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
.login-in{width:100%;max-width:380px;margin:0 auto}
.login img{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.login p{color:var(--gris);margin:14px 0 26px;text-align:center}
.login .campo input{background:var(--cielo-2)}
.pin{letter-spacing:.4em;font-size:24px!important}

/* Navegación inferior */
nav.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.barra .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.barra button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--gris);position:relative}
nav.barra svg{width:25px;height:25px}
nav.barra button[aria-current="page"]{color:var(--silicio)}
nav.barra button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--silicio)}
nav.barra .badge[hidden]{display:none}
nav.barra .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Avisos de sistema */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--cielo);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(30,28,33,.25);display:none}
#toast.ver{display:block}
#toast.mal{background:var(--rojo)}
.sin-red{background:var(--ambar);color:var(--tinta);font-weight:600;font-size:15px;padding:9px 16px;text-align:center}
.cargando{padding:60px 20px;text-align:center;color:var(--gris)}
.aviso-caja{background:var(--rojo-claro);color:#7F2214;border-radius:14px;padding:14px 16px;font-weight:500}
.nota{padding:12px 0;border-bottom:1px solid var(--linea)}
.nota:last-child{border-bottom:0}
.nota .q{font-size:14px;color:var(--gris)}
.texto-largo{white-space:pre-wrap}
.tarea{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 14px}
.tarea.atrasada{border-left:7px solid var(--rojo)}
.tarea .cuerpo{flex:1;min-width:0;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer}
.tarea .cuerpo b{display:block;font-size:17px;line-height:1.3}
.tarea .cuerpo small{display:block;color:var(--gris);font-size:14px;margin-top:2px}
.tarea.hecha .cuerpo b{text-decoration:line-through;color:var(--gris);font-weight:600}
.check-t{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--silicio);background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.check-t svg{width:20px;height:20px;opacity:0}
.tarea.hecha .check-t{background:var(--silicio)}
.tarea.hecha .check-t svg{opacity:1}
.persona .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.marcas{display:flex;gap:8px;flex-wrap:wrap}
.equipo-sel{display:grid;gap:6px;margin-top:4px}
.equipo-sel label{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;padding:8px 10px;border:2px solid var(--linea);border-radius:10px;margin:0}
.equipo-sel input{width:22px;height:22px;min-height:0;accent-color:var(--silicio)}
@media (min-width:600px){.cifras{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="red"></div>
<div id="app"></div>
<nav class="barra" id="nav" hidden aria-label="Secciones">
  <div class="in">
    <button data-tab="jornada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Jornada</button>
    <button data-tab="obras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 9h14l2 10H3z"/><path d="M4 14h16M9.5 9 9 19M14.5 9l.5 10"/><circle cx="17" cy="4" r="2"/></svg>Obras</button>
    <button data-tab="avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.4-.4-2.4z"/></svg>Avisos<span class="badge" id="badge-avisos" hidden></span></button>
    <button data-tab="tareas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Tareas<span class="badge" id="badge-tareas" hidden></span></button>
    <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="tab-mas">Más</span><span class="badge" id="badge-mas" hidden></span></button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ───────── Configuración y utilidades ───────── */
const CFG = window.APP_CONFIG || {};
const API_URL = CFG.API_URL || '';

/* ───────── Comunicación con el servidor y cola sin conexión ───────── */
class ApiError extends Error {}
async function llamar(action, data) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...data }), redirect: 'follow' });
  let j;
  try { j = await r.json(); } catch { throw new TypeError('respuesta no válida'); }
  if (!j.ok) {
    if (j.error === 'SESION') { salir(true); throw new ApiError('Tu sesión ha caducado. Vuelve a entrar.'); }
    throw new ApiError(j.error || 'Error del servidor');
  }
  return j.data;
}
async function api(action, data = {}, opt = {}) {
  const clave = 'c_' + action + '_' + JSON.stringify(data);
  try {
    if (!navigator.onLine) throw new TypeError('offline');
    const res = await llamar(action, data);
    if (opt.cache) LS.set(clave, res);
    return res;
  } catch (e) {
    if (e instanceof ApiError) throw e;
    if (opt.cola) {
      if (!encolar(action, data)) throw new Error('No hay espacio en el móvil para guardarlo sin conexión. Inténtalo cuando tengas cobertura.');
      return { encolado: true };
    }
    if (opt.cache) { const c = LS.get(clave); if (c !== null) { S.desdeCache = true; return c; } }
    throw new Error('Sin conexión. Revisa la cobertura y vuelve a intentarlo.');
  }
}
const cola = () => LS.get('cola', []);
function encolar(action, data) {
  const c = cola(); c.push({ action, data: { ...data, origen: 'sin conexión' }, ts: Date.now() });
  const ok = LS.set('cola', c); pintarRed(); return ok;
}
let vaciando = false;
async function vaciarCola() {
  if (vaciando || !navigator.onLine || !S.token) return;
  vaciando = true;
  let enviados = 0;
  try {
    while (cola().length) {
      const [op] = cola();
      try { await llamar(op.action, op.data); enviados++; }
      catch (e) {
        if (!(e instanceof ApiError)) break;           // sigue sin red: se reintenta más tarde
        LS.set('fallidos', [...LS.get('fallidos', []), { ...op, error: e.message }]);
        toast('No se pudo enviar un registro guardado: ' + e.message, true);
      }
      LS.set('cola', cola().slice(1));
    }
  } finally { vaciando = false; pintarRed(); }
  if (enviados) { toast(enviados === 1 ? 'Registro pendiente enviado' : `${enviados} registros pendientes enviados`); if (S.vista === 'jornada') render(); }
}
function pintarRed() {
  const n = cola().length, el = $('#red');
  if (!navigator.onLine) el.innerHTML = `<div class="sin-red">Sin conexión.${n ? ` ${n} ${n === 1 ? 'registro se enviará' : 'registros se enviarán'} al recuperar cobertura.` : ' Puedes seguir fichando y anotando horas.'}</div>`;
  else if (n) el.innerHTML = `<div class="sin-red">Enviando ${n} ${n === 1 ? 'registro pendiente' : 'registros pendientes'}…</div>`;
  else el.innerHTML = '';
}
addEventListener('online', () => { pintarRed(); vaciarCola(); });

let tToast;
function toast(msg, mal = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'ver' + (mal ? ' mal' : '');
  clearTimeout(tToast); tToast = setTimeout(() => t.className = '', mal ? 5000 : 3000);

function gps() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), precision: Math.round(p.coords.accuracy) }),
      () => res({}), { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
  });
}
async function comprimir(file, max = 1600, q = 0.72) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

}

/* Hoja inferior con soporte para el botón atrás de Android */
let hojaAbierta = null;
function abrirHoja(titulo, html, alMontar) {
  quitarHoja();
  const v = document.createElement('div');
  v.className = 'velo';
  v.innerHTML = `<div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="asa"></div>
    <div class="hoja-cab"><h3>${esc(titulo)}</h3><button class="cerrar" aria-label="Cerrar">×</button></div>${html}</div>`;
  v.addEventListener('click', e => { if (e.target === v) cerrarHoja(); });
  $('.cerrar', v).onclick = cerrarHoja;
  document.body.appendChild(v);
  hojaAbierta = v;
  history.pushState({ hoja: 1 }, '');
  const primero = $('input:not([type=hidden]):not([type=file]),select,textarea', v);
  if (alMontar) alMontar(v);
  if (primero && !primero.dataset.nofocus) setTimeout(() => primero.focus({ preventScroll: true }), 50);
  return v;
}
function quitarHoja() { if (hojaAbierta) { hojaAbierta.remove(); hojaAbierta = null; } }
function cerrarHoja() { if (hojaAbierta) history.back(); }
function confirmar(texto, si = 'Confirmar', peligro = false) {
  return new Promise(res => {
    let r = false;
    const v = abrirHoja('¿Seguro?', `<p>${esc(texto)}</p><div class="grupo" style="margin-top:18px">
      <button class="btn btn-linea" data-no>Cancelar</button><button class="btn ${peligro ? 'btn-rojo' : 'btn-oscuro'}" data-si>${esc(si)}</button></div>`);
    $('[data-no]', v).onclick = () => cerrarHoja();
    $('[data-si]', v).onclick = () => { r = true; cerrarHoja(); };
    const obs = new MutationObserver(() => { if (!document.body.contains(v)) { obs.disconnect(); res(r); } });
    obs.observe(document.body, { childList: true });
  });
}
/** Envía un formulario de la hoja con estado de carga y errores visibles. */
function enviarForm(v, fn) {
  const f = $('form', v);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('button[type=submit]', f), err = $('.error-form', f), txt = b.textContent;
    b.disabled = true; b.textContent = 'Guardando…'; err.textContent = '';
    try { await fn(Object.fromEntries(new FormData(f)), f); }
    catch (x) { err.textContent = x.message; b.disabled = false; b.textContent = txt; }
  });
}
function campoFoto(nombre = 'foto', texto = 'Hacer o elegir foto') {
  return `<label class="foto-btn"><input type="file" accept="image/*" capture="environment" data-foto="${nombre}" data-nofocus="1">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg><span>${texto}</span></label><img class="previa" hidden alt="">`;
}
function montarFoto(v, destino) {
  const inp = $('[data-foto]', v); if (!inp) return;
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    $('.foto-btn span', v).textContent = 'Preparando foto…';

}

function calcular(lista, ahora = Date.now()) {
  const ord = [...lista].sort((a, b) => new Date(a.fechaHora) - new Date(b.fechaHora));
  const dias = {}; let ini = null, dia = null;
  for (const f of ord) {
    const t = new Date(f.fechaHora).getTime();
    if (f.tipo === 'entrada') { ini = t; dia = diaDe(f.fechaHora); dias[dia] = dias[dia] || 0; continue; }
    if (!dia) continue;
    if (f.tipo === 'pausa_inicio') { if (ini) dias[dia] += (t - ini) / 6e4; ini = null; }
    else if (f.tipo === 'pausa_fin') ini = t;
    else if (f.tipo === 'salida') { if (ini) dias[dia] += (t - ini) / 6e4; ini = null; dia = null; }
  }
  if (ini && dia) dias[dia] += (ahora - ini) / 6e4;
  const ultimo = ord[ord.length - 1];
  return { dias, estado: ultimo ? ultimo.tipo : 'salida', abierto: !!(dia), diaAbierto: dia };
}

function pintarAnillo() {
  const c = calcular(S.jor.fichajes), hoy = hoyISO();
  let min = c.dias[hoy] || 0;
  if (c.abierto && c.diaAbierto !== hoy) min = c.dias[c.diaAbierto] || 0;
  const r = 104, L = 2 * Math.PI * r, p = Math.min(min / META_MIN, 1);
  const extra = min > META_MIN ? Math.min((min - META_MIN) / META_MIN, 1) : 0;
  const el = $('#anillo'); if (!el) return c;
  const etiqueta = { entrada: '<b>Trabajando</b>', pausa_fin: '<b>Trabajando</b>', pausa_inicio: '<b>En pausa</b>', salida: c.dias[hoy] ? 'Jornada terminada' : 'Sin empezar' }[c.estado];
  el.innerHTML = `<svg viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="${r}" fill="none" stroke="#E8EBF1" stroke-width="16"/>
      <circle cx="120" cy="120" r="${r}" fill="none" stroke="#4F70BF" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L * p} ${L}"/>
      ${extra ? `<circle cx="120" cy="120" r="${r}" fill="none" stroke="#E8A400" stroke-width="16" stroke-linecap="round" stroke-dasharray="${L * extra} ${L}"/>` : ''}
    </svg>
    <div class="centro"><div class="tiempo num">${hm(min)}</div><div class="estado">${etiqueta}</div>
    <div class="meta">de ${hm(META_MIN)} h${c.abierto && c.diaAbierto !== hoy ? ' · empezó ayer' : ''}</div></div>`;
  el.setAttribute('aria-label', `${hm(min)} horas trabajadas hoy`);
  return c;
}

async function fichar(tipo, boton) {
  if (tipo === 'salida' && !(await confirmar('Vas a terminar la jornada de hoy.', 'Terminar jornada'))) return;
  $$('[data-fichar]').forEach(b => b.disabled = true);
  boton.textContent = 'Obteniendo ubicación…';
  const pos = await gps();
  const rec = { id: uuid(), tipo, fechaHora: new Date().toISOString(), ...pos, obraId: tipo === 'entrada' ? ($('#obra-hoy')?.value || '') : '' };
  try {
    const r = await api('fichar', rec, { cola: true });
    S.jor.fichajes.push(rec);
    toast(r.encolado ? 'Guardado sin conexión. Se enviará al recuperar cobertura.' : `${TIPO_FICHAJE[tipo]} registrada a las ${hora(rec.fechaHora)}${pos.lat ? '' : ' (sin ubicación)'}`);
  } catch (e) { toast(e.message, true); }
  pintarJornada();
}
async function vHistorial() {
  const hasta = hoyISO(), desde = claveDia(new Date(Date.now() - 30 * 864e5));
  const d = await api('misFichajes', { desde, hasta }, { cache: true });
  const total = d.jornadas.reduce((s, j) => s + j.minutos, 0);
  app.innerHTML = cabecera('Mi registro de jornada', 'Últimos 30 días', { volver: true }) + `<div class="wrap">
    <div class="resumen" style="grid-template-columns:1fr 1fr"><div class="dest"><b class="num">${hm(total)}</b><span>horas trabajadas</span></div>
      <div><b class="num">${d.jornadas.length}</b><span>días con fichaje</span></div></div>
    <h2>Por día</h2>
    ${d.jornadas.length ? `<div class="scroll-x"><table class="tabla"><thead><tr><th>Día</th><th>Entrada</th><th>Salida</th><th class="r">Pausas</th><th class="r">Horas</th></tr></thead><tbody>
      ${[...d.jornadas].reverse().map(j => `<tr><td>${fCorta(j.fecha)}</td><td>${hora(j.entrada)}</td><td>${j.salida ? hora(j.salida) : '<span class="chip rojo">Sin salida</span>'}</td><td class="r">${j.pausas}</td><td class="r num"><b>${hm(j.minutos)}</b></td></tr>`).join('')}

    <p style="color:var(--gris);font-size:14px">Si ves un error en tus fichajes, avisa a la oficina. Los registros no se pueden modificar desde la app.</p></div>`;
}

/* ───────── Ausencias ───────── */
async function vAusencias({ mes } = {}) {
  mes = mes || hoyISO().slice(0, 7);
  const [mias, cal] = await Promise.all([api('misAusencias', {}, { cache: true }), api('calendarioAusencias', { mes }, { cache: true })]);
  const r = mias.resumen;
  const [y, m] = mes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1), diasMes = new Date(y, m, 0).getDate();
  const hueco = (primero.getDay() + 6) % 7;
  const prev = claveDia(new Date(y, m - 2, 1)).slice(0, 7), sig = claveDia(new Date(y, m, 1)).slice(0, 7);
  let celdas = '';
  for (let i = 0; i < hueco; i++) celdas += '<span></span>';
  for (let dia = 1; dia <= diasMes; dia++) {
    const k = `${y}-${pad(m)}-${pad(dia)}`, w = new Date(y, m - 1, dia).getDay();
    const aqui = cal.filter(x => x.desde <= k && x.hasta >= k);
    const mia = aqui.find(x => x.propio && x.estado === 'aprobada'), pend = aqui.find(x => x.propio && x.estado === 'pendiente');
    const otros = aqui.filter(x => !x.propio);
    celdas += `<button class="d ${w === 0 || w === 6 ? 'finde' : ''} ${k === hoyISO() ? 'hoy' : ''} ${mia ? 'mia' : pend ? 'pend' : ''}" data-dia="${k}" aria-label="${dia}${aqui.length ? ', ' + aqui.map(x => x.nombre).join(', ') : ''}">${dia}
      ${otros.length ? `<span class="p">${otros.slice(0, 3).map(() => '<i></i>').join('')}</span>` : ''}</button>`;
  }
  const nombreMes = mayus(primero.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
  app.innerHTML = cabecera('Ausencias', 'Vacaciones, permisos y bajas', { volver: true, extra: `<button class="btn btn-sol btn-peq" id="pedir">Pedir días</button>` }) + `<div class="wrap">
    <div class="resumen"><div class="dest"><b class="num">${r.disponibles}</b><span>días libres</span></div>
      <div><b class="num">${r.aprobados}</b><span>aprobados</span></div><div><b class="num">${r.pendientes}</b><span>pendientes</span></div></div>
    <p style="color:var(--gris);font-size:14px;margin:8px 0 0">Vacaciones de ${new Date().getFullYear()}: ${r.derecho} días laborables en total.</p>
    <h2>Calendario</h2>
    <div class="cal-cab"><button class="btn btn-linea btn-peq" data-mes="${prev}" aria-label="Mes anterior">‹</button><strong>${nombreMes}</strong><button class="btn btn-linea btn-peq" data-mes="${sig}" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span class="ds">${x}</span>`).join('')}${celdas}</div>
    <div class="leyenda"><span><i style="background:var(--silicio)"></i>Tus días aprobados</span><span><i style="background:var(--sol-claro);border:2px dashed #B98500"></i>Pendientes</span><span><i style="background:var(--cielo);border-radius:50%"></i>Compañeros fuera</span></div>
    <h2>Mis solicitudes</h2>
    ${mias.lista.length ? `<div class="lista">${mias.lista.map(x => `<div class="item"><div style="display:flex;justify-content:space-between;gap:10px"><div class="t">${esc(TIPOS_AUSENCIA[x.tipo] || x.tipo)}</div>${chip(ESTADOS_AUSENCIA, x.estado)}</div>
      <div class="s">${x.desde === x.hasta ? fLarga(x.desde) : fCorta(x.desde) + ' al ' + fCorta(x.hasta)}, ${x.dias} ${x.dias == 1 ? 'día laborable' : 'días laborables'}</div>
      ${x.motivo ? `<div style="margin-top:4px">${esc(x.motivo)}</div>` : ''}</div>`).join('')}</div>`
      : '<div class="vacio">No has pedido ningún día. Pulsa «Pedir días» para solicitar vacaciones o un permiso.</div>'}
  </div>`;
  $$('[data-mes]').forEach(b => b.onclick = () => ir('ausencias', { mes: b.dataset.mes }, true));
  $$('[data-dia]').forEach(b => b.onclick = () => {
    const k = b.dataset.dia, aqui = cal.filter(x => x.desde <= k && x.hasta >= k);
    if (aqui.length) toast(fCorta(k) + ': ' + aqui.map(x => x.nombre + (x.estado === 'pendiente' ? ' (pendiente)' : '')).join(', '));
  });
  $('#pedir').onclick = formAusencia;
}
function formAusencia() {
  const extra = {};
  const v = abrirHoja('Pedir días', `<form>
    <div class="campo"><label for="v-t">Tipo</label><select id="v-t" name="tipo" data-nofocus="1">${Object.entries(TIPOS_AUSENCIA).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div>
    <div class="dos-campos"><div class="campo"><label for="v-d">Desde</label><input id="v-d" type="date" name="desde" required></div>
    <div class="campo"><label for="v-h">Hasta</label><input id="v-h" type="date" name="hasta" required></div></div>
    <p class="ayuda" id="v-n" style="color:var(--gris);margin:6px 0 0"></p>
    <div class="campo"><label for="v-m">Motivo o comentario (opcional)</label><textarea id="v-m" name="motivo"></textarea></div>
    <div class="campo" id="v-j" hidden><label>Justificante</label>${campoFoto('foto', 'Fotografiar justificante')}</div>
    <button class="btn btn-sol ancho" type="submit">Enviar solicitud</button><p class="error-form" role="alert"></p></form>`, v => {
      const t = $('#v-t', v), d = $('#v-d', v), h = $('#v-h', v);
      const cuenta = () => {
        if (!d.value || !h.value || h.value < d.value) return $('#v-n', v).textContent = '';
        let n = 0; for (let x = aFecha(d.value); x <= aFecha(h.value); x.setDate(x.getDate() + 1)) if (x.getDay() % 6) n++;
        $('#v-n', v).textContent = `${n} ${n === 1 ? 'día laborable' : 'días laborables'}`;
      };
      d.onchange = () => { if (!h.value || h.value < d.value) h.value = d.value; h.min = d.value; cuenta(); };
      h.onchange = cuenta;
      t.onchange = () => { $('#v-j', v).hidden = !['permiso', 'baja'].includes(t.value); };
      montarFoto(v, extra);
    });
  enviarForm(v, async d => {
    const r = await api('solicitarAusencia', { id: uuid(), ...d, foto: extra.foto || '' });
    cerrarHoja(); toast(r.estado === 'aprobada' ? 'Baja registrada' : 'Solicitud enviada. Te avisaremos cuando se apruebe.'); setTimeout(render, 300);
  });
}

  return `<span class="chip ${cls}">${que} ${dias < 0 ? 'caducada' : fCorta(f)}</span>`;
}
function placa(m) { return `<div class="placa" aria-label="Matrícula ${esc(m)}"><i>E</i><span>${esc(String(m).replace(/^(\d{4})([A-Z]{3})$/, '$1 $2'))}</span></div>`; }

}

    <div class="campo"><label for="k-k">Kilómetros que marca ahora</label><input id="k-k" class="num" type="number" name="km" min="0" step="1" inputmode="numeric" required placeholder="${esc(f.km || '')}"></div>
    ${f.km ? `<p class="ayuda" style="color:var(--gris);margin:6px 0 0">Último dato: ${Number(f.km).toLocaleString('es-ES')} km</p>` : ''}
    <button class="btn btn-sol ancho" type="submit">Guardar kilómetros</button><p class="error-form" role="alert"></p></form>`);
  enviarForm(v, async d => { await api('actualizarKm', { id: f.id, km: Number(d.km) }); cerrarHoja(); toast('Kilómetros guardados'); setTimeout(render, 300); });
}
async function vFurgonetas() {
  const [lista, users] = await Promise.all([api('furgonetas', {}, { cache: true }), usuariosLista().catch(() => [])]);
  S.flota = lista;
  const activas = lista.filter(f => f.activa);
  app.innerHTML = cabecera('Furgonetas', `${activas.length} en servicio, ${activas.filter(f => !f.asignadoA).length} sin asignar`, { volver: true, extra: `<button class="btn btn-sol btn-peq" id="f-nueva">Añadir furgoneta</button>` }) +
    `<div class="wrap">${lista.length ? `<div class="lista">${lista.map(f => `<button class="item" data-f="${esc(f.id)}" style="${f.activa ? '' : 'opacity:.6'}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">${placa(f.matricula)}
        ${!f.activa ? '<span class="chip">Fuera de servicio</span>' : f.asignadoA ? `<span class="chip oscuro">${esc(f.asignadoNombre)}</span>` : '<span class="chip sol">Sin asignar</span>'}</div>
      <div class="t" style="margin-top:10px">${esc(f.modelo || 'Furgoneta')}${f.alias ? ' (' + esc(f.alias) + ')' : ''}</div>
      <div class="s">${f.km !== '' && f.km != null ? Number(f.km).toLocaleString('es-ES') + ' km' : 'Sin kilómetros anotados'}</div>
      <div class="venc">${estadoFecha(f.itv, 'ITV')}${estadoFecha(f.seguro, 'Seguro')}${estadoFecha(f.revision, 'Revisión')}</div></button>`).join('')}</div>`
      : '<div class="vacio">Todavía no hay furgonetas. Añádelas con su matrícula y asígnalas a cada trabajador.<br><button class="btn btn-azul" id="f-nueva-2">Añadir la primera</button></div>'}</div>`;
  [$('#f-nueva'), $('#f-nueva-2')].forEach(b => b && (b.onclick = () => formFurgoneta({}, users)));
  $$('[data-f]').forEach(b => b.onclick = () => formFurgoneta(lista.find(f => f.id === b.dataset.f), users));
}
function formFurgoneta(f, users) {
  const val = k => esc(f[k] ?? '');
  const v = abrirHoja(f.id ? 'Furgoneta ' + f.matricula : 'Añadir furgoneta', `<form>
    <div class="dos-campos"><div class="campo"><label for="fu-m">Matrícula</label><input id="fu-m" name="matricula" required value="${val('matricula')}" placeholder="1234 ABC" autocapitalize="characters" style="text-transform:uppercase"></div>
    <div class="campo"><label for="fu-a">Nombre corto</label><input id="fu-a" name="alias" value="${val('alias')}" placeholder="La blanca"></div></div>
    <div class="campo"><label for="fu-mo">Marca y modelo</label><input id="fu-mo" name="modelo" value="${val('modelo')}" placeholder="Renault Trafic"></div>
    <div class="campo"><label for="fu-as">Asignada a</label><select id="fu-as" name="asignadoA"><option value="">Nadie (queda libre en la nave)</option>
      ${users.map(u => `<option value="${esc(u.id)}" ${u.id === f.asignadoA ? 'selected' : ''}>${esc(u.nombre)}${u.furgoneta && u.furgoneta !== f.matricula ? ' (ya lleva ' + esc(u.furgoneta) + ')' : ''}</option>`).join('')}</select>
      <p class="ayuda">Si la persona ya tenía otra furgoneta, esa queda libre.</p></div>
    <div class="campo"><label for="fu-k">Kilómetros</label><input id="fu-k" class="num" type="number" name="km" min="0" inputmode="numeric" value="${val('km')}"></div>
    <div class="dos-campos"><div class="campo"><label for="fu-i">ITV hasta</label><input id="fu-i" type="date" name="itv" value="${val('itv')}"></div>
    <div class="campo"><label for="fu-s">Seguro hasta</label><input id="fu-s" type="date" name="seguro" value="${val('seguro')}"></div></div>
    <div class="campo"><label for="fu-r">Próxima revisión</label><input id="fu-r" type="date" name="revision" value="${val('revision')}"></div>
    <div class="campo"><label for="fu-n">Notas</label><textarea id="fu-n" name="notas" placeholder="Material que lleva, baca, escalera, llaves de repuesto…">${val('notas')}</textarea></div>
    <label class="check"><input type="checkbox" name="activa" ${f.id && !f.activa ? '' : 'checked'}> En servicio</label>
    <button class="btn btn-sol ancho" type="submit">${f.id ? 'Guardar cambios' : 'Añadir furgoneta'}</button><p class="error-form" role="alert"></p></form>
    ${f.historial && f.historial.length ? `<h2>Quién la ha llevado</h2><div class="caja">${f.historial.map(h => `<div class="nota"><b>${esc(h.nombre)}</b>
      <div class="q">Desde el ${fCorta(h.desde)}${h.hasta ? ' hasta el ' + fCorta(h.hasta) : ', ahora'}${h.kmInicio !== '' && h.kmInicio != null ? `, ${Number(h.kmInicio).toLocaleString('es-ES')} km${h.kmFin ? ' a ' + Number(h.kmFin).toLocaleString('es-ES') + ' km' : ''}` : ''}</div></div>`).join('')}</div>` : ''}`);
  enviarForm(v, async d => {
    await api('guardarFurgoneta', { furgoneta: { ...d, id: f.id || uuid(), activa: !!d.activa } });
    cerrarHoja(); S.usuarios = null; toast(f.id ? 'Furgoneta actualizada' : 'Furgoneta añadida'); setTimeout(render, 300);
  });
}

/* ───────── Arranque ───────── */
history.replaceState({ vista: 'jornada', params: {} }, '');
pintarRed();
render();
vaciarCola();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
